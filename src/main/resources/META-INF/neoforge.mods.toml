modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Xulai"
displayTest="IGNORE_ALL_VERSION"
description='''
Wall Climb - hold the jump key while facing a wall and you climb it. Obstacles up to two blocks tall can be grabbed by default: you stick to the wall, slide straight up along it and step onto the top. The maximum climbable height is configurable, so real walls, cliffs and buildings behave exactly as before unless you raise the limit. Set the maximum height to 0 to disable the mod. Empty hands, no item, no durability, identical in survival and creative. The logic runs on the client, so singleplayer, LAN and servers all behave the same.

贴墙攀爬：面对墙时按住跳跃键即可攀爬。默认情况下，最高两格高的方块可以攀住：角色贴住墙面，沿墙向上滑动并站上顶部。最大可爬高度可在配置中调整，因此真正的墙、悬崖和建筑默认不受影响。将最大高度设为 0 即可关闭本模组。空手即可，不需要物品也不消耗耐久，生存与创造表现一致。逻辑在客户端运行，单人、局域网和服务器表现相同。
可调项在 config/wallclimb-client.toml（最大高度、攀爬速度），支持热重载与模组列表里的配置界面。
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
